name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os == 'Windows'
        run: npx tsx --test test/password-prompt.test.ts test/ssh2-config.test.ts test/ssh2-session.test.ts
      - run: npm audit --omit=dev
